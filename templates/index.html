<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef3ff;
            text-align: center;
            padding-top: 100px;
        }
        form {
            background: white;
            display: inline-block;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="url"] {
            width: 300px;
            padding: 8px;
        }
        button {
            padding: 8px 16px;
            background: #4169e1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

<h1>Simple URL Shortener</h1>

<form method="POST">
    {% csrf_token %}
    <input type="url" name="long_url" placeholder="Enter your long URL..." required>
    <button type="submit">Shorten</button>
</form>

{% if short_url %}
<div class="result">
    <h3>Your short URL:</h3>
    <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
</div>
{% endif %}

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

</body>
</html>
